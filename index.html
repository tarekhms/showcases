<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <meta
      name="description"
      content="Showcases.dev is getting ready. A new home for thoughtful work is coming soon."
    >
    <title>Showcases.dev — Coming soon</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f4f7fb;
        background: #101827;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        grid-template-rows: 1fr auto;
        justify-items: center;
        background:
          radial-gradient(ellipse at 50% 42%, rgb(35 91 145 / 22%), transparent 42%),
          #101827;
      }

      main {
        align-self: center;
        width: min(100% - 40px, 760px);
        padding: 72px 0;
        text-align: center;
      }

      .mark {
        display: grid;
        width: 58px;
        height: 58px;
        margin: 0 auto 28px;
        place-items: center;
        border: 1px solid rgb(104 194 255 / 38%);
        border-radius: 18px;
        color: #78c8ff;
        background: rgb(104 194 255 / 8%);
        box-shadow: 0 0 60px rgb(59 150 224 / 15%);
      }

      .mark svg {
        width: 29px;
        height: 29px;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: #91b5d3;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(48px, 10vw, 88px);
        font-weight: 650;
        letter-spacing: -.075em;
        line-height: .98;
      }

      h1 span {
        color: #78c8ff;
      }

      .intro {
        max-width: 490px;
        margin: 25px auto 0;
        color: #a9b7c8;
        font-size: clamp(15px, 2.4vw, 18px);
        line-height: 1.75;
      }

      .rule {
        width: 42px;
        height: 1px;
        margin: 38px auto 20px;
        background: #65c7ed;
      }

      .note {
        margin: 0;
        color: #75859a;
        font-size: 12px;
        letter-spacing: .04em;
      }

      footer {
        width: min(100% - 40px, 1200px);
        padding: 18px 0 22px;
        color: #75859a;
        font-size: 11px;
        text-align: right;
      }

      .powered-by {
        color: inherit;
        text-decoration: none;
        transition: color .2s ease;
      }

      .powered-by:hover {
        color: #f4f7fb;
      }

      .powered-by-brand {
        color: rgb(241 245 249 / 92%);
        font-size: 14px;
        font-weight: 300;
        letter-spacing: -.04em;
      }

      .powered-by-accent {
        color: #f03355;
      }

      .powered-by:focus-visible {
        outline: 2px solid #78c8ff;
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: arrive .8s ease-out both;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(12px);
          }

          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M5 7.5h22v17H5z" stroke="currentColor" stroke-width="1.5" />
          <path d="M11 7.5v17m10-17v17M5 16h22" stroke="currentColor" stroke-width="1" opacity=".7" />
          <path d="m25.5 3 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z" fill="#72e3e8" />
        </svg>
      </div>
      <p class="eyebrow">A new space is taking shape</p>
      <h1>Worth<br><span>showing.</span></h1>
      <p class="intro">
        We’re putting the finishing touches on Showcases.dev.
        Something thoughtful is on its way.
      </p>
      <div class="rule" aria-hidden="true"></div>
      <p class="note">Thanks for stopping by. See you soon.</p>
    </main>
    <footer>
      <a class="powered-by" href="https://gorbit.be" target="_blank" rel="noopener noreferrer">
        Powered by <span class="powered-by-brand">G<span class="powered-by-accent">o</span>rbit</span>
      </a>
    </footer>
  </body>
</html>
